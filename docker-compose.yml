services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-replace-before-production}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: wealth_assistant
      FRONTEND_URL: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-mock}
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
