[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the reconstructed Wealth Conversational Finance Assistant"
requires-python = ">=3.12"
dependencies = [
  "bcrypt>=4.1",
  "cloudinary>=1.41",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "PyJWT>=2.10",
  "pymongo>=4.10",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
test = ["mongomock>=4.3", "pytest>=8.3", "pytest-cov>=6.0"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
